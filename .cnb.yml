# CNB 流水线：Windows 侧没有构建节点，能落地的是「Linux + Qt 目标」的
# 全量编译与打包 —— 与 .github/workflows/linux.yml 等价，并把 Qt UI 源码
# 真正编一遍（MFC legacy 目标依赖 afxwin.h，只能在 Windows 上编）。
#
# 两条硬约束，都是实测出来的：
#
# 1) 跑的是 sh（dash），不是 bash。不要写 set -euo pipefail，pipefail 在
#    dash 里不存在，`set -e` 也别写成 `set -eu`（后面跟着别的命令时，
#    压平后会粘成 `set -eu cmake ...`，-u 会把后续词吞成位置参数）。
#
# 2) CNB 会把 script 的每一行**压成一行**再交给 sh。压平之后只剩空格，
#    所以靠换行分隔的命令会粘在一起，而靠分号分隔的照样成立。下面每个
#    stage 行尾的分号是语法，不是风格；while/if 也写成自带分号的形态，
#    heredoc 一律不用（压平后定界符会失效，内容会被 shell 当命令执行）。
#

main:
  push:
    - name: linux-qt
      docker:
        image: ubuntu:24.04
      stages:
        - name: install-deps
          script: |
            set -e;
            apt-get update;
            export DEBIAN_FRONTEND=noninteractive;
            export TZ=UTC;
            PKGS='build-essential cmake ninja-build pkg-config git ca-certificates';
            PKGS="$PKGS qtbase5-dev libqt5svg5-dev qtbase5-dev-tools";
            PKGS="$PKGS nlohmann-json3-dev libcjson-dev freerdp3-dev libwinpr3-dev";
            apt-get install -y --no-install-recommends $PKGS || true;
            dpkg --configure -a >/dev/null 2>&1 || true;
            test -x /usr/bin/cmake;
            pkg-config --exists freerdp3;
            pkg-config --modversion freerdp3 freerdp-client3 winpr3 libcjson;

        - name: build
          # 20 分钟无输出会判定超时，编译期间每 60 秒打一次心跳。
          # 心跳只用 kill -0 轮询：dash 里 `wait <sleep>` 会被任何信号打断，
          # 60 秒的 sleep 常常等不到，循环就变成忙等。构建退出码单独用
          # if 收口 —— `wait && ...` 在 set -e 下会被判成条件语境，失败被吞掉。
          script: |
            set -e;
            FAIL=0;
            cmake --preset linux-release;
            cmake --build --preset linux-release --parallel &
            build_pid=$!;
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 60;
            done;
            if wait "$build_pid"; then rc=0; else rc=$?; FAIL=1; fi;
            echo "build exit code: $rc";
            if [ "$FAIL" -ne 0 ]; then exit "$rc"; fi;

        - name: package
          # 便携包 = 二进制 + 依赖的 Qt5/freerdp/winpr/cjson 共享库 + xcb/svg 插件
          # + translations（CMake 的 POST_BUILD 把 .qm 放在二进制旁，缺了走英文）。
          # 正则只用字符类表达，不写 `\/`、`\(...\)` 这种转义 —— 实测平台的
          # 压平会把反斜杠吃掉，历史版本因此打出过没有共享库的包，又因为
          # while 在管道里让失败不冒泡而"绿"了。现在每一步都显式 test，
          # 包内容不达标就让阶段红。
          script: |
            set -e;
            VERSION="$(grep -m1 'project(RdpBox VERSION' src/CMakeLists.txt | tr -s ' ' | cut -d' ' -f4)";
            test -n "$VERSION";
            STAGE="dist/RdpBoxQt-${VERSION}-linux-x64";
            rm -rf "$STAGE";
            mkdir -p "${STAGE}/lib" "${STAGE}/plugins/platforms" "${STAGE}/plugins/imageformats";
            cp build/linux-release/src/RdpBoxQt "${STAGE}/RdpBoxQt";
            cp -r build/linux-release/src/translations "${STAGE}/translations";
            ldd build/linux-release/src/RdpBoxQt | awk '/=> \//{print $3}' | sort -u | while read -r lib; do
              case "${lib}" in
                */libQt5*|*/libfreerdp*|*/libwinpr*|*/libcjson*|*/libssl*|*/libcrypto*)
                  cp -L "${lib}" "${STAGE}/lib/";;
              esac;
            done;
            PLUGDIR="$(qtchooser -print/qt5/plugins 2>/dev/null || qmake -qt=5 -query QT_INSTALL_PLUGINS 2>/dev/null || echo /usr/lib/x86_64-linux-gnu/qt5/plugins)";
            cp "${PLUGDIR}/platforms/libqxcb.so" "${STAGE}/plugins/platforms/";
            cp "${PLUGDIR}/imageformats/libqsvg.so" "${STAGE}/plugins/imageformats/" || true;
            RESOLVED="$(ldd "${STAGE}/RdpBoxQt" | grep -c 'not found' || true)";
            test "${RESOLVED:-0}" -eq 0;
            LIBS="$(ls "${STAGE}/lib" | grep -c '^lib')";
            test "${LIBS:-0}" -gt 0;
            test -f "${STAGE}/plugins/platforms/libqxcb.so";
            test -f "${STAGE}/translations/rdpbox_zh.qm";
            L="${STAGE}/RdpBoxQt.sh";
            echo '#!/bin/sh' > "$L";
            echo 'HERE="$(cd "$(dirname "$0")" && pwd)"' >> "$L";
            echo 'export LD_LIBRARY_PATH="${HERE}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"' >> "$L";
            echo 'export QT_PLUGIN_PATH="${HERE}/plugins"' >> "$L";
            echo 'exec "${HERE}/RdpBoxQt" "$@"' >> "$L";
            chmod +x "$L";
            tar -czf "dist/RdpBoxQt-${VERSION}-linux-x64.tar.gz" -C dist "$(basename "$STAGE")";

        - name: smoke-test
          # 无 X11 显示，跑不了 GUI：只验二进制、依赖库能解析、产物齐全。
          script: |
            set -e;
            binary=./build/linux-release/src/RdpBoxQt;
            test -x "$binary";
            ldd "$binary" | grep "not found" && exit 1;
            ls -l dist/*.tar.gz;
            tar -tzf dist/*.tar.gz > members.txt;
            grep -q '/RdpBoxQt$' members.txt;
            grep -q '/RdpBoxQt.sh$' members.txt;
            grep -q '/plugins/platforms/libqxcb[.]so$' members.txt;
            grep -q '/translations/rdpbox_zh[.]qm$' members.txt;

# PR 上也要跑：这条流水线是 Qt 目标唯一的编译证据（GitHub Actions 的
# windows.yml 要 vcpkg 全量拉 qtbase，命中缓存才有性价比）。
pr:
  pull_request:
    - name: linux-qt
      docker:
        image: ubuntu:24.04
      stages:
        - name: install-deps
          script: |
            set -e;
            apt-get update;
            export DEBIAN_FRONTEND=noninteractive;
            export TZ=UTC;
            PKGS='build-essential cmake ninja-build pkg-config git ca-certificates';
            PKGS="$PKGS qtbase5-dev libqt5svg5-dev qtbase5-dev-tools";
            PKGS="$PKGS nlohmann-json3-dev libcjson-dev freerdp3-dev libwinpr3-dev";
            apt-get install -y --no-install-recommends $PKGS || true;
            dpkg --configure -a >/dev/null 2>&1 || true;
            test -x /usr/bin/cmake;
            pkg-config --exists freerdp3;
            pkg-config --modversion freerdp3 freerdp-client3 winpr3 libcjson;

        - name: build
          script: |
            set -e;
            FAIL=0;
            cmake --preset linux-release;
            cmake --build --preset linux-release --parallel &
            build_pid=$!;
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 60;
            done;
            if wait "$build_pid"; then rc=0; else rc=$?; FAIL=1; fi;
            echo "build exit code: $rc";
            if [ "$FAIL" -ne 0 ]; then exit "$rc"; fi;

        - name: smoke-test
          script: |
            set -e;
            binary=./build/linux-release/src/RdpBoxQt;
            test -x "$binary";
            ldd "$binary" | grep "not found" && exit 1;
