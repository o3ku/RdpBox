name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.12.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite;nuget,GitHub,readwrite

jobs:
  release:
    name: Build and publish
    runs-on: windows-2022

    steps:
      - name: Resolve tag
        id: resolve-tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not ($tag -match '^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$tag' must start with a version-like v tag, for example v1.12.0."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          where.exe cl
          cmake --version
          ninja --version
          if (-not $env:VCToolsInstallDir) {
            throw "VCToolsInstallDir is not set."
          }

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $null
          if (Test-Path "C:\vcpkg\vcpkg.exe") {
            $root = "C:\vcpkg"
          }
          if (-not $root -and $env:VCPKG_ROOT) {
            $root = $env:VCPKG_ROOT
          }
          if (-not $root -and $env:VCPKG_INSTALLATION_ROOT) {
            $root = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not $root) {
            throw "Could not locate vcpkg on the runner."
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            vcpkg_installed
          key: windows-release-vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            windows-vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Configure vcpkg binary cache
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $nuget = & "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget
          if (-not $nuget) {
            throw "Could not locate nuget via vcpkg."
          }
          & $nuget sources remove -Name GitHub -NonInteractive 2>$null | Out-Null
          & $nuget sources add `
            -Name GitHub `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -UserName "${{ github.repository_owner }}" `
            -Password "$env:GH_PACKAGES_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive


      - name: Fetch Qt bundle
        # Prebuilt vcpkg install root (x64-windows-static-md, windows-2022
        # image): vcpkg below sees the shipped vcpkg/status and skips Qt.
        uses: o3ku/qt-static@v1
        with:
          tag: qt5-win2022-20261024-0121
          dest: ${{ env.VCPKG_INSTALLED_DIR }}
      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-cache" | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet=$env:VCPKG_DEFAULT_TRIPLET `
            cjson freerdp nlohmann-json qt5-base qt5-svg `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --x-buildtrees-root="D:\vcpkg-buildtrees" `
            --clean-after-build

      - name: Configure debug tests
        shell: pwsh
        run: |
          cmake -S . -B build/msvc-debug-test -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_TEST=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build debug tests
        run: cmake --build build/msvc-debug-test --parallel

      - name: Run tests
        run: ctest --test-dir build/msvc-debug-test --output-on-failure

      # The Qt UI ships in the same source tree as the legacy shell, so a
      # Windows-only Qt break has to fail the release, not be discovered later.
      - name: Configure Qt release
        shell: pwsh
        run: |
          $env:CMAKE_AUTOCONFIRM = "1"
          cmake -S . -B build/msvc-release-qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DRDPBOX_BUILD_QT=ON `
            -DRDPBOX_BUILD_LEGACY=OFF `
            "-DRDPBOX_VERSION_OVERRIDE=$env:RELEASE_TAG" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build Qt release
        run: cmake --build build/msvc-release-qt --target RdpBox --parallel

      - name: Configure release
        shell: pwsh
        run: |
          cmake -S . -B build/msvc-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DRDPBOX_BUILD_QT=OFF `
            -DRDPBOX_BUILD_LEGACY=ON `
            "-DRDPBOX_VERSION_OVERRIDE=$env:RELEASE_TAG" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build release
        run: cmake --build build/msvc-release --target RdpBoxLegacy --parallel

      - name: Prepare release assets
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $sourceExe = Join-Path $env:GITHUB_WORKSPACE "build\msvc-release\src\RdpBox.exe"
          if (-not (Test-Path $sourceExe)) {
            throw "Release executable was not found at $sourceExe."
          }

          Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $artifactDir "RdpBox.exe")
          Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $artifactDir "RdpBox-$env:RELEASE_TAG.exe")

          $sourceQtExe = Join-Path $env:GITHUB_WORKSPACE "build\msvc-release-qt\src\RdpBoxQt.exe"
          if (-not (Test-Path $sourceQtExe)) {
            throw "Qt release executable was not found at $sourceQtExe."
          }

          Copy-Item -LiteralPath $sourceQtExe -Destination (Join-Path $artifactDir "RdpBoxQt.exe")
          Copy-Item -LiteralPath $sourceQtExe -Destination (Join-Path $artifactDir "RdpBoxQt-$env:RELEASE_TAG.exe")

          Push-Location $artifactDir
          # LF-only lines: sha256sum -c and the in-app updater (which
          # compares the file name without a trailing CR) both need it.
          $sums = (Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }) -join "`n"
          [System.IO.File]::WriteAllText("$artifactDir\SHA256SUMS.txt", $sums + "`n")
          Pop-Location

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release-artifacts\RdpBox.exe" `
            "release-artifacts\RdpBox-$env:RELEASE_TAG.exe" `
            "release-artifacts\RdpBoxQt.exe" `
            "release-artifacts\RdpBoxQt-$env:RELEASE_TAG.exe" `
            "release-artifacts\SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --title "$env:RELEASE_TAG" `
            --notes "RdpBox $env:RELEASE_TAG"

  release-linux:
    name: Publish Qt Linux bundle (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    # The Windows job creates the release; this only attaches assets to it.
    needs: release

    steps:
      - name: Resolve tag
        id: resolve-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if ! echo "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$tag' must start with a version-like v tag, for example v1.12.0." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qtbase5-dev libqt5svg5-dev \
            nlohmann-json3-dev libcjson-dev \
            freerdp3-dev libwinpr3-dev

      - name: Verify pkg-config modules
        run: |
          pkg-config --modversion freerdp3 freerdp-client3 winpr3 libcjson

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      # Same bundle as the Linux CI artifact, named after the release tag so a
      # re-dispatched old tag still produces a matching asset name.
      - name: Package portable bundle
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGE="dist/RdpBoxQt-${VERSION}-linux-x64"
          mkdir -p "${STAGE}/lib" "${STAGE}/plugins/platforms" "${STAGE}/plugins/imageformats"

          cp build/linux-release/src/RdpBoxQt "${STAGE}/RdpBoxQt"

          # Bundle the exe's non-base shared objects (Qt5 / freerdp / winpr / cjson).
          ldd build/linux-release/src/RdpBoxQt | awk '/=> \/|^\//{print $3}' | sort -u | while read -r lib; do
            case "${lib}" in
              */libQt5*|*/libfreerdp*|*/libwinpr*|*/libcjson*|*/libssl*|*/libcrypto*)
                cp -L "${lib}" "${STAGE}/lib/" ;;
            esac
          done

          PLUGDIR="$(qtchooser -print/qt5/plugins 2>/dev/null || qmake -qt=5 -query QT_INSTALL_PLUGINS 2>/dev/null || echo /usr/lib/x86_64-linux-gnu/qt5/plugins)"
          cp "${PLUGDIR}/platforms/libqxcb.so" "${STAGE}/plugins/platforms/"
          cp "${PLUGDIR}/imageformats/libqsvg.so" "${STAGE}/plugins/imageformats/" || true

          cat > "${STAGE}/RdpBoxQt.sh" <<'EOS'
          #!/bin/sh
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="${HERE}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export QT_PLUGIN_PATH="${HERE}/plugins"
          exec "${HERE}/RdpBoxQt" "$@"
          EOS
          sed -i 's/^          //' "${STAGE}/RdpBoxQt.sh"
          chmod +x "${STAGE}/RdpBoxQt.sh"

          tar -czf "dist/RdpBoxQt-${VERSION}-linux-x64.tar.gz" -C dist "RdpBoxQt-${VERSION}-linux-x64"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
