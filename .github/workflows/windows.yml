name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  # Never cancel: a killed run loses nothing today, but a run that does build
  # something new loses its cache/package upload.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite;nuget,GitHub,readwrite

jobs:
  build-test:
    name: Build and test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          where.exe cl
          cmake --version
          ninja --version
          if (-not $env:VCToolsInstallDir) {
            throw "VCToolsInstallDir is not set."
          }

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $null
          if (Test-Path "C:\vcpkg\vcpkg.exe") {
            $root = "C:\vcpkg"
          }
          if (-not $root -and $env:VCPKG_ROOT) {
            $root = $env:VCPKG_ROOT
          }
          if (-not $root -and $env:VCPKG_INSTALLATION_ROOT) {
            $root = $env:VCPKG_INSTALLATION_ROOT
          }
          if (-not $root) {
            throw "Could not locate vcpkg on the runner."
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          # vcpkg_installed is no longer cached: the bundle replaces it, and a
          # ~7 GB cache entry costs more than it saves.
          key: windows-vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}
          # key is workflow-independent on purpose: editing this file must not
          # invalidate the store (the bundle below carries the real versions).
          restore-keys: |
            windows-vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Fetch Qt bundle
        # Prebuilt vcpkg install root (x64-windows-static-md, windows-2022
        # image): vcpkg below sees the shipped vcpkg/status and skips Qt
        # entirely. Anonymous download - fork PRs work without any secrets.
        uses: o3ku/qt-static@v1
        with:
          tag: qt5-win2022-20261024-0121
          dest: ${{ env.VCPKG_INSTALLED_DIR }}

      - name: Configure vcpkg binary cache
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $nuget = & "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget
          if (-not $nuget) {
            throw "Could not locate nuget via vcpkg."
          }
          & $nuget sources remove -Name GitHub -NonInteractive 2>$null | Out-Null
          & $nuget sources add `
            -Name GitHub `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -UserName "${{ github.repository_owner }}" `
            -Password "$env:GH_PACKAGES_TOKEN" `
            -StorePasswordInClearText `
            -NonInteractive

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-cache" | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet=$env:VCPKG_DEFAULT_TRIPLET `
            cjson freerdp nlohmann-json qt5-base qt5-svg `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --x-buildtrees-root="D:\vcpkg-buildtrees" `
            --clean-after-build

      - name: Configure debug tests
        shell: pwsh
        run: |
          cmake -S . -B build/msvc-debug-test -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_TEST=ON `
            -DRDPBOX_BUILD_QT=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build debug tests
        run: cmake --build build/msvc-debug-test --parallel

      - name: Run tests
        run: ctest --test-dir build/msvc-debug-test --output-on-failure

      # qtui/ Windows-only branches (FramelessWin.h, the WH_KEYBOARD_LL hook
      # path) were compiled by no job: every Windows configure passed
      # RDPBOX_BUILD_QT=OFF. AUTOCONFIRM=1 stops the qt5 feature install from
      # waiting on an interactive prompt when a dependency is missing.
      - name: Configure Qt release
        shell: pwsh
        run: |
          $env:CMAKE_AUTOCONFIRM = "1"
          cmake -S . -B build/msvc-release-qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DRDPBOX_BUILD_QT=ON `
            -DRDPBOX_BUILD_LEGACY=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build Qt release
        run: cmake --build build/msvc-release-qt --target RdpBox --parallel

      - name: Configure release
        shell: pwsh
        run: |
          cmake -S . -B build/msvc-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DRDPBOX_BUILD_QT=OFF `
            -DRDPBOX_BUILD_LEGACY=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build release
        run: cmake --build build/msvc-release --target RdpBoxLegacy --parallel
